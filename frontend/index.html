<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hive</title>
    <meta name="description" content="Discover, manage, download, and chat with GGUF models. A beautiful desktop-class web application.">
    <!-- Use Outfit and Inter for a modern, minimal typography mix -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <!-- Feather Icons for clean minimal iconography -->
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
    <div class="app-wrapper">
        <!-- App Navigation -->
        <nav class="app-nav">
            <div class="nav-brand animated-hive" style="height: 70px; display: flex; align-items: center; justify-content: center;">
                <svg width="41" height="41" viewBox="-4 -6 48 48" xmlns="http://www.w3.org/2000/svg">
                    <path class="hex hex-1" d="M20,4 L27,8 L27,16 L20,20 L13,16 L13,8 Z" />
                    <path class="hex hex-2" d="M13,16 L20,20 L20,28 L13,32 L6,28 L6,20 Z" />
                    <path class="hex hex-3" d="M27,16 L34,20 L34,28 L27,32 L20,28 L20,20 Z" />
                    <!-- Orbiting Bee -->
                    <circle class="bee" cx="20" cy="18" r="2" />
                </svg>
            </div>
            <div class="nav-links">
                <button id="nav-discover" class="nav-link active">
                    <i data-feather="search"></i>
                    <span>Discover</span>
                </button>
                <button id="nav-downloads" class="nav-link">
                    <i data-feather="download-cloud"></i>
                    <span>Downloads</span>
                    <span id="download-badge" class="nav-badge hidden">0</span>
                </button>
                <button id="nav-chat" class="nav-link">
                    <i data-feather="message-circle"></i>
                    <span>Chat</span>
                </button>
            </div>
            <div class="nav-footer">
                <div class="footer-text">Powered by HF API</div>
            </div>
        </nav>

        <!-- Main Workspace Area -->
        <div class="workspace-area">
            
            <!-- VIEW 1: Discover -->
            <div id="view-discover" class="workspace-view active">
                <aside class="sidebar">
                    <div class="search-box">
                        <i data-feather="search" class="search-icon"></i>
                        <input type="text" id="searchInput" placeholder="Search models..." autocomplete="off"/>
                    </div>
                    <div class="sidebar-content">
                        <div class="loading-state hidden" id="searchLoading">
                            <div class="spinner"></div>
                        </div>
                        <ul id="searchResults" class="model-list">
                            <!-- Search results populated here -->
                        </ul>
                    </div>
                </aside>

                <main class="main-content">
                    <div class="details-pane hidden" id="modelDetails">
                        <header class="details-header">
                            <h1 id="modelTitle">Model Name</h1>
                            <div class="model-meta" id="modelMeta"></div>
                        </header>
                        <div class="files-section">
                            <div class="section-title">
                                <h2>Available Model Files</h2>
                            </div>
                            <div class="loading-state hidden" id="filesLoading">
                                <div class="spinner"></div>
                            </div>
                            <ul id="fileList" class="file-list">
                                <!-- File list populated here -->
                            </ul>
                        </div>
                    </div>
                    
                    <div class="empty-state" id="emptyState">
                        <i data-feather="search" class="empty-icon"></i>
                        <p>Search for a model to view details</p>
                    </div>
                </main>
            </div>

            <!-- VIEW 2: Downloads -->
            <div id="view-downloads" class="workspace-view hidden">
                <div class="downloads-page-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
                    <h1>Local Models & Downloads</h1>
                    <div class="download-path-selector" style="display: flex; align-items: center; gap: 0.5rem; background: var(--bg-surface); padding: 0.5rem; border-radius: var(--radius-md); border: 1px solid var(--border-subtle);">
                        <span style="font-size: 0.85rem; color: var(--text-secondary);">Save Path:</span>
                        <input type="text" id="downloadPathInput" style="background: var(--bg-base); border: 1px solid var(--border-strong); color: var(--text-primary); padding: 0.4rem 0.6rem; border-radius: var(--radius-sm); font-size: 0.85rem; width: 250px;" placeholder="C:\Models" autocomplete="off">
                        <button id="btnBrowsePath" class="action-btn" title="Browse" style="background: var(--bg-base); border: 1px solid var(--border-strong); padding: 0.4rem; border-radius: var(--radius-sm); cursor: pointer; color: var(--text-primary);">
                            <i data-feather="folder"></i>
                        </button>
                        <button id="btnSavePath" class="action-btn" title="Save Path" style="background: var(--accent); border: none; padding: 0.4rem 0.8rem; border-radius: var(--radius-sm); cursor: pointer; color: white; font-weight: 500; font-size: 0.85rem;">
                            Save
                        </button>
                    </div>
                </div>
                <div class="downloads-page-content">
                    <div id="downloadsContainer" class="downloads-grid">
                        <div class="empty-downloads">No local models or active downloads</div>
                    </div>
                </div>
            </div>

            <!-- VIEW 3: Chat -->
            <div id="view-chat" class="workspace-view hidden">
                <!-- Chat Sidebar -->
                <aside class="chat-sidebar">
                    <div class="chat-sidebar-header">
                        <button id="chat-new-btn" class="chat-new-btn">
                            <i data-feather="plus"></i>
                            <span>New Chat</span>
                        </button>
                    </div>
                    <div class="chat-sidebar-search">
                        <i data-feather="search" class="chat-search-icon"></i>
                        <input type="text" id="chatSearchInput" placeholder="Search chats..." autocomplete="off">
                    </div>
                    <div class="chat-conversation-list" id="chatConversationList">
                        <!-- Populated by JS -->
                    </div>
                    <div class="chat-sidebar-footer">
                        <div class="chat-model-badge" id="chatModelBadge" title="Click to open chat settings">
                            <div class="chat-model-dot" id="chatModelDot"></div>
                            <span class="chat-model-text" id="chatModelText">No model loaded</span>
                        </div>
                    </div>
                </aside>

                <!-- Chat Main Area -->
                <div class="chat-main">
                    <div class="chat-header">
                        <div class="chat-header-left">
                            <span class="chat-title" id="chatTitle">New Chat</span>
                        </div>
                        <div class="chat-header-right">
                            <button id="chat-settings-toggle" class="chat-settings-btn" title="Chat Settings">
                                <i data-feather="settings"></i>
                            </button>
                        </div>
                    </div>

                    <div id="chatMessagesContainer" class="chat-messages-container">
                        <!-- Messages rendered by JS -->
                    </div>

                    <div class="chat-input-area">
                        <div class="chat-input-wrapper">
                            <textarea id="chatMessageInput"
                                      placeholder="Send a message…"
                                      rows="1"
                                      autocomplete="off"></textarea>
                            <div class="chat-input-actions">
                                <span class="chat-shortcut-hint">Ctrl + Enter</span>
                                <button id="chatSendBtn" title="Send message" class="chat-send-btn">
                                    <i data-feather="send"></i>
                                </button>
                                <button id="chatStopBtn" title="Stop generation" class="chat-stop-btn" style="display: none;">
                                    <i data-feather="square"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Chat Settings Panel -->
                <aside id="chatSettingsPanel" class="chat-settings-panel">
                    <div class="chat-settings-header">
                        <h3>Chat Settings</h3>
                        <button id="chatSettingsClose" class="chat-settings-close-btn">
                            <i data-feather="x"></i>
                        </button>
                    </div>
                    <div class="chat-settings-content">
                        <!-- Model Loader -->
                        <div class="chat-settings-section">
                            <div class="chat-settings-section-title">Model</div>
                            <div class="chat-model-loader">
                                <select id="chatModelSelect" class="chat-model-select">
                                    <option value="">Select a local model...</option>
                                </select>
                                <div class="chat-model-browse-row">
                                    <button id="chatBrowseBtn" class="chat-browse-btn">Browse File...</button>
                                </div>
                                <div class="chat-model-actions">
                                    <button class="chat-load-btn" id="chatLoadModelBtn">Load Model</button>
                                    <button class="chat-unload-btn" id="chatUnloadModelBtn" style="display: none;">Unload</button>
                                </div>
                                <div class="chat-model-info-card" id="chatModelInfoCard" style="display: none;">
                                    <!-- Populated by JS -->
                                </div>
                            </div>
                        </div>

                        <!-- Temperature -->
                        <div class="chat-settings-section">
                            <div class="chat-settings-section-title">Creativity</div>
                            <div class="chat-setting-group">
                                <div class="chat-setting-label">
                                    <span id="chatTemperatureLabel">Balanced</span>
                                    <span class="chat-setting-value" id="chatTemperatureValue">0.7</span>
                                </div>
                                <input type="range" id="chatTemperatureSlider" min="0" max="2" step="0.1" value="0.7" class="chat-slider">
                                <div class="chat-slider-labels">
                                    <span><svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="3"/><line x1="8" y1="0" x2="8" y2="4"/><line x1="8" y1="12" x2="8" y2="16"/><line x1="0" y1="8" x2="4" y2="8"/><line x1="12" y1="8" x2="16" y2="8"/></svg> Precise</span>
                                    <span>Creative <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1l1.5 3.5L13 6l-3 2.5L11 12l-3-2-3 2 1-3.5L3 6l3.5-1.5z"/></svg></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </aside>
            </div>

        </div>
    </div>

    <!-- Toast Notification -->
    <div id="chatToast" class="chat-toast"></div>

    <!-- Loading Overlay -->
    <div id="chatLoadingOverlay" class="chat-loading-overlay">
        <div class="spinner"></div>
        <div class="chat-loading-text">Loading model…</div>
    </div>

    <script src="markdown.js"></script>
    <script src="app.js"></script>
    <script>
        feather.replace();
    </script>
</body>
</html>

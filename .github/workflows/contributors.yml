name: Generate Contributors SVG

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Generate SVG
        run: |
          # Fetch stats with retry logic for 202 Accepted
          echo "Fetching contributors from GitHub API..."
          HTTP_STATUS=$(curl -s -w "%{http_code}" -o stats.json -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/${{ github.repository }}/stats/contributors)
          
          MAX_RETRIES=12
          RETRY_COUNT=0
          while [ "$HTTP_STATUS" = "202" ] && [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "GitHub is computing stats, waiting 10s..."
            sleep 10
            HTTP_STATUS=$(curl -s -w "%{http_code}" -o stats.json -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/${{ github.repository }}/stats/contributors)
            RETRY_COUNT=$((RETRY_COUNT+1))
          done
          
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Failed to get stats, HTTP status: $HTTP_STATUS"
            cat stats.json
            exit 1
          fi
          
          # Parse and loop over contributors (filtering out bot accounts)
          jq -r '.[] | select((.author.login | endswith("[bot]")) | not) | [.author.login, .author.avatar_url, .total, ([.weeks[].a] | add), ([.weeks[].d] | add)] | @tsv' stats.json | sort -k3 -n -r > parsed.tsv
          
          HTML_SNIPPET=""
          
          # Helper function to format large numbers (e.g., 1.5M, 24K)
          format_num() {
            echo "$1" | awk '{
              if ($1 >= 1000000) printf "%.1fM", $1/1000000
              else if ($1 >= 1000) printf "%.1fK", $1/1000
              else print $1
            }' | sed 's/\.0[KM]//'
          }
          
          while IFS=$'\t' read -r USERNAME AVATAR_URL RAW_COMMITS RAW_ADDED RAW_DELETED; do
            # Base64 encode the avatar
            AVATAR_B64="data:image/jpeg;base64,$(curl -s "$AVATAR_URL&s=100" | base64 -w 0)"
            
            # Format large numbers to prevent SVG text overflow
            COMMITS=$(format_num "$RAW_COMMITS")
            ADDED=$(format_num "$RAW_ADDED")
            DELETED=$(format_num "$RAW_DELETED")
            
            # Generate individual SVG
            sed -e "s|{{USERNAME}}|$USERNAME|g" \
                -e "s|{{AVATAR_URL}}|$AVATAR_B64|g" \
                -e "s|{{COMMITS}}|$COMMITS|g" \
                -e "s|{{LOC_ADDED}}|$ADDED|g" \
                -e "s|{{LOC_DELETED}}|$DELETED|g" \
                assets/contributor_template.svg > "assets/contributor-${USERNAME}.svg"
            
            # Append to HTML snippet
            HTML_SNIPPET+="<a href=\"https://github.com/${USERNAME}\"><img src=\"assets/contributor-${USERNAME}.svg\" width=\"390\" /></a>"
          done < parsed.tsv
          
          # write snippet to a temp file (allow variable expansion)
          cat > snippet.html <<EOF
          ${HTML_SNIPPET}
          EOF
          
          # replace the region in README.md safely by having Perl read the snippet file
          perl -0777 -pe 'BEGIN{local $/; open my $fh, "<", "snippet.html" or die $!; $snippet = <$fh>; close $fh}
            s/(<!-- CONTRIBUTORS_START -->).*?(<!-- CONTRIBUTORS_END -->)/$1\n$snippet\n$2/s' README.md > README.md.tmp && mv README.md.tmp README.md
          
          rm -f snippet.html
          
          rm stats.json parsed.tsv
          # Remove the old legacy monolithic SVG if it exists
          rm -f assets/contributors.svg

      - name: Commit changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/contributor-*.svg README.md
          # Remove legacy SVG from git if it exists
          git rm -q --ignore-unmatch assets/contributors.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update responsive dynamic contributor cards" && git push)
